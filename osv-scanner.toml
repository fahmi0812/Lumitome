# Allowlist osv-scanner (dibaca otomatis dari root proyek).
# Setiap entri WAJIB punya `reason` (dicek `npm run validate`) dan sebaiknya `ignoreUntil`.
# Sejak v0.3.42 (P1-1): `packs/` dan `.opencode/skills/` IKUT dipindai — skrip di
# dalamnya dieksekusi agen. Satu-satunya penekanan per temuan adalah [[IgnoredVulns]]
