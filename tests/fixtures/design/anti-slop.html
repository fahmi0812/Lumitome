<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture anti-slop — gradien ungu + teks bergradien + Inter di mana-mana</title>
<style>
  body { font-family: Inter, sans-serif; background: #FFFFFF; color: #1A1A1A; margin: 0; padding: 32px; box-sizing: border-box; }
  .hero { background: linear-gradient(135deg, #7C3AED, #4F46E5); padding: 48px 32px; border-radius: 16px; max-width: 800px; box-sizing: border-box; }
  h1.grad-text { background: linear-gradient(90deg, #7C3AED, #EC4899); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 48px; margin: 0; }
  h2 { color: #1A1A1A; font-size: 24px; margin: 24px 0 8px; }
  p { color: #1A1A1A; font-size: 16px; line-height: 1.6; }
  .stripes { background: repeating-linear-gradient(45deg, #E5E7EB 0 10px, #FFFFFF 10px 20px); height: 40px; max-width: 800px; box-sizing: border-box; }
  button { height: 48px; min-width: 48px; padding: 0 16px; background: #1A1A1A; color: #FFFFFF; border: none; font-family: Inter, sans-serif; font-size: 16px; }
  .state { color: #1A1A1A; font-size: 14px; }
</style>
</head>
<body>
  <div class="hero"><h1 class="grad-text">Kopi Senja</h1></div>
  <h2>Racikan Istimewa</h2>
  <p>Semua teks di halaman ini memakai Inter; hero memakai gradien ungu; judul memakai teks bergradien; strip memakai gradien berulang.</p>
  <p>Paragraf kedua, juga Inter — dominasi font overused harus tertangkap gate.</p>
  <div class="stripes"></div>
  <button>Pesan Sekarang</button>
  <div class="state" data-state="empty">Belum ada pesanan.</div>
  <div class="state" data-state="loading">Memuat menu…</div>
  <div class="state" data-state="error">Gagal memuat. Coba lagi.</div>
</body>
</html>
