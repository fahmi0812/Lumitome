<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture aturan baru v0.3.36 (unslop signs)</title>
<style>
  body { font-family: Georgia, serif; background: #fff; color: #1a1a1a; margin: 0; padding: 16px; }
  h1 { color: #1a1a1a; font-size: 32px; font-weight: 400; }
  h2 { color: #1a1a1a; font-size: 24px; font-weight: 400; }
  p { color: #1a1a1a; }
  button { height: 48px; min-width: 48px; padding: 0 16px; font-size: 16px; }
  .heavy { font-weight: 800; }
  .tracked { text-transform: uppercase; letter-spacing: 3px; font-size: 12px; }
  .state { color: #1a1a1a; font-size: 14px; }
</style>
</head>
<body>
  <h1>Welcome back, Damir! 👋</h1>
  <h2>Supercharge your workflow with AI</h2>
  <p class="heavy">Teks tebal 800 yang seharusnya tidak tebal.</p>
  <p class="tracked">Navigation</p>
  <button class="animate-pulse">Beli sekarang!</button>
  <button class="hover:scale-105">Lihat demo</button>
  <div class="state" data-state="empty">Belum ada data.</div>
  <div class="state" data-state="loading">Memuat data…</div>
  <div class="state" data-state="error">Gagal memuat. Coba lagi.</div>
</body>
</html>
